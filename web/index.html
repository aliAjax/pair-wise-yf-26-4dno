<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数字档案长期保存</title>
<style>body{font:16px system-ui;max-width:980px;margin:32px auto;padding:0 16px}input,textarea,button,select{font:inherit;padding:8px;margin:4px}textarea{width:100%;height:110px}.panel{border:1px solid #bbb;padding:16px;border-radius:8px;margin:12px 0}pre{background:#f4f4f4;padding:12px;white-space:pre-wrap}.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:13px}.pending{background:#fff3cd}.completed{background:#d4edda}.invalidated{background:#f8d7da}</style></head>
<body><h1>数字档案长期保存</h1><p>演示账号：owner/archivist（甲机构 org-a）、owner-b/archivist-b（乙机构 org-b）、auditor、outsider。请求使用 <code>X-User-Id</code>。</p>
<section class="panel"><select id="user"><option>owner</option><option>archivist</option><option>owner-b</option><option>archivist-b</option><option>auditor</option><option>outsider</option></select>
<button onclick="loadStatus()">查看档案状态</button>
<button onclick="loadTransfers()">查看移交批次</button>
<button onclick="startTransfer()">发起移交→org-b</button>
<pre id="out"></pre></section>
<p>状态页会显示 <code>active_transfer</code>（进行中的批次、逐份副本条目和阻塞项）。写入与逐份确认等完整流程由 JSON API 提供，见 README。</p>
<script>
const out=document.querySelector("#out"),user=document.querySelector("#user");
function aid(){return prompt("档案 ID","1")}
async function loadStatus(){const r=await fetch(`/api/archives/${aid()}/status`,{headers:{"X-User-Id":user.value}});render(await r.json())}
async function loadTransfers(){const r=await fetch(`/api/archives/${aid()}/transfers`,{headers:{"X-User-Id":user.value}});render(await r.json())}
async function startTransfer(){
  const r=await fetch(`/api/archives/${aid()}/transfers`,{method:"POST",headers:{"X-User-Id":user.value,"Content-Type":"application/json"},body:JSON.stringify({target_institution_id:"org-b"})});
  render(await r.json());
}
function render(d){
  const s=JSON.stringify(d,(k,v)=>v,2);
  out.innerHTML=s.replace(/"state":\s*"(pending|completed|invalidated)"/g,(m,s)=>`"state": "<span class="tag ${s}">${s}</span>"`);
}
</script></body></html>
